name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[api,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/usb_adc_dfr1184
      - run: pytest
